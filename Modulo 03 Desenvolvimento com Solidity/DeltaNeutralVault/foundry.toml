[profile.default]
src = "."
out = "out"
libs = ["node_modules"]
test = "test"
cache_path = "cache_forge"

# Remappings para imports
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@chainlink/=node_modules/@chainlink/",
    "@uniswap/v3-core/=node_modules/@uniswap/v3-core/",
    "@uniswap/v3-periphery/=node_modules/@uniswap/v3-periphery/"
]

# Solidity version
solc_version = "0.8.20"

# Optimizer
optimizer = true
optimizer_runs = 200

# EVM version
evm_version = "paris"

# Verbosity
verbosity = 2

# Gas reports
gas_reports = ["*"]

# Fuzz
[fuzz]
runs = 256
max_test_rejects = 65536

# Invariant
[invariant]
runs = 256
depth = 15
fail_on_revert = true

# RPC endpoints
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
airbithon = "${AIRBITHON_RPC_URL}"

# Etherscan
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }

# Formatter
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
